<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Ron's Education</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center py-10" id="page-body">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

      const educationData = [
        {
          id: 1,
          level: "Elementary",
          school: "Don Jose Ynares Sr. Memorial Elementary School",
          detail: "Completed elementary education.",
          years: "2011 – 2017",
          logo: "../images/logo/elementary.png",
          side: "left",
          achievement: null,
        },
        {
          id: 2,
          level: "Junior High School",
          school: "Don Jose Ynares Sr. Memorial National High School",
          detail: "Specialized in DRAFTING curriculum.",
          years: "2017 – 2021",
          logo: "../images/logo/jhs.png",
          side: "right",
          achievement: "🥉 Science Quiz Bee — 3rd Place",
        },
        {
          id: 3,
          level: "Senior High School",
          school: "Angono National High School",
          detail: "Completed STEM Strand.",
          years: "2021 – 2023",
          logo: "../images/logo/shs.png",
          side: "left",
          achievement: "🏅 With Honors",
        },
        {
          id: 4,
          level: "College",
          school: "East System College of Rizal",
          detail: "Bachelor of Science in Information Technology.",
          years: "2023 – Present",
          logo: "../images/logo/college.png",
          side: "right",
          achievement: null,
        },
      ];

      function SchoolLogo({ src, name, darkMode }) {
        const [err, setErr] = React.useState(false);
        const initials = name.split(" ").filter(w => /^[A-Z]/.test(w)).map(w => w[0]).join("").slice(0, 3);
        if (err || !src) {
          return (
            <div className={`w-12 h-12 rounded-full border flex items-center justify-center shrink-0 ${darkMode ? "border-white/10 bg-white/5" : "border-black/10 bg-black/5"}`}>
              <span className={`text-[10px] font-bold ${darkMode ? "text-white/40" : "text-black/40"}`}>{initials}</span>
            </div>
          );
        }
        return (
          <img
            src={src}
            alt={name + " logo"}
            onError={() => setErr(true)}
            className="w-12 h-12 rounded-full object-contain border border-black/10 bg-white shrink-0"
          />
        );
      }

      function CardContent({ item, darkMode, size }) {
        const isSm = size === "sm";
        return (
          <div className="flex flex-col gap-1 min-w-0">
            <span className={`${isSm ? "text-[9px]" : "text-[10px]"} uppercase tracking-widest font-semibold`} style={{color: darkMode ? "rgba(255,255,255,0.35)" : "rgba(0,0,0,0.35)"}}>
              {item.level}
            </span>
            <p className={`${isSm ? "text-xs" : "text-sm"} font-bold leading-snug ${darkMode ? "text-white" : "text-black"}`}>
              {item.school}
            </p>
            <p className={`${isSm ? "text-[11px]" : "text-xs"}`} style={{color: darkMode ? "rgba(255,255,255,0.55)" : "rgba(0,0,0,0.55)"}}>
              {item.detail}
            </p>
            {item.achievement && (
              <span className={`mt-1 self-start ${isSm ? "text-[9px]" : "text-[10px]"} px-2 py-0.5 rounded-full font-semibold ${darkMode ? "bg-yellow-400/10 text-yellow-300" : "bg-yellow-50 text-yellow-700 border border-yellow-200"}`}>
                {item.achievement}
              </span>
            )}
            <span className={`mt-1 self-start ${isSm ? "text-[9px]" : "text-[10px]"} px-2 py-0.5 rounded-full font-medium`} style={{backgroundColor: darkMode ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.05)", color: darkMode ? "rgba(255,255,255,0.60)" : "rgba(0,0,0,0.50)"}}>
              {item.years}
            </span>
          </div>
        );
      }

      function TimelineItem({ item, idx, darkMode, total }) {
        const isLeft = item.side === "left";
        const isLast = idx === total - 1;

        return (
          <div className="relative flex md:contents">

            {/* ── MOBILE LAYOUT ── */}
            <div className="flex md:hidden w-full">
              <div className="flex flex-col items-center mr-4">
                <div className={`w-3 h-3 rounded-full border-2 shrink-0 mt-5 ${darkMode ? "bg-white border-[#111]" : "bg-black border-white"}`} />
                {!isLast && <div className={`w-px flex-1 mt-1 ${darkMode ? "bg-white/15" : "bg-black/10"}`} />}
              </div>
              <div className={`mb-8 flex-1 rounded-2xl border p-4 flex items-start gap-3 ${darkMode ? "bg-[#1a1a1a] border-white/10" : "bg-white border-black/10"}`}>
                <SchoolLogo src={item.logo} name={item.school} darkMode={darkMode} />
                <CardContent item={item} darkMode={darkMode} size="sm" />
              </div>
            </div>

            {/* ── DESKTOP LEFT CELL ── */}
            <div className="hidden md:flex md:justify-end md:pr-8 md:pb-14">
              {isLeft && (
                <div className={`rounded-2xl border p-5 flex items-start gap-4 w-72 ${darkMode ? "bg-[#1a1a1a] border-white/10" : "bg-white border-black/10"}`}>
                  <SchoolLogo src={item.logo} name={item.school} darkMode={darkMode} />
                  <CardContent item={item} darkMode={darkMode} size="md" />
                </div>
              )}
            </div>

            {/* ── DESKTOP CENTER DOT ── */}
            <div className="hidden md:flex md:flex-col md:items-center md:pb-14">
              <div className={`w-3 h-3 rounded-full border-2 shrink-0 mt-6 z-10 ${darkMode ? "bg-white border-[#111]" : "bg-black border-white"}`} />
              {!isLast && <div className={`w-px flex-1 mt-1 ${darkMode ? "bg-white/15" : "bg-black/10"}`} />}
            </div>

            {/* ── DESKTOP RIGHT CELL ── */}
            <div className="hidden md:flex md:pl-8 md:pb-14">
              {!isLeft && (
                <div className={`rounded-2xl border p-5 flex items-start gap-4 w-72 ${darkMode ? "bg-[#1a1a1a] border-white/10" : "bg-white border-black/10"}`}>
                  <SchoolLogo src={item.logo} name={item.school} darkMode={darkMode} />
                  <CardContent item={item} darkMode={darkMode} size="md" />
                </div>
              )}
            </div>

          </div>
        );
      }

      function App() {
        const [darkMode, setDarkMode] = React.useState(
          () => localStorage.getItem("darkMode") === "true"
        );

        React.useEffect(() => {
          const onStorage = () => setDarkMode(localStorage.getItem("darkMode") === "true");
          window.addEventListener("storage", onStorage);
          return () => window.removeEventListener("storage", onStorage);
        }, []);

        React.useEffect(() => {
          const body = document.getElementById("page-body");
          body.style.backgroundColor = darkMode ? "#0a0a0a" : "";
        }, [darkMode]);

        return (
          <div
            className={`w-[95vw] md:w-[820px] min-h-[90vh] rounded-2xl border shadow-[0_4px_40px_rgba(0,0,0,0.08)] p-5 md:p-10 transition-colors duration-300 ${darkMode ? "bg-[#111111] border-white/10" : "bg-white border-black/10"}`}
            data-dark={darkMode ? "true" : "false"}
          >
            {/* TOP BAR */}
            <div className="flex items-center mb-8">
              <a
                href="./index.html"
                className={`flex items-center gap-1.5 text-xs font-medium border rounded-full px-3 py-1.5 transition-colors cursor-pointer ${darkMode ? "border-white/20 text-white hover:bg-white/5" : "border-black/15 text-black hover:bg-black/5"}`}
              >
                <svg className="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/>
                </svg>
                Back
              </a>
            </div>

            {/* TITLE */}
            <div className="text-center mb-10">
              <h1 className={`text-2xl md:text-3xl font-bold ${darkMode ? "text-white" : "text-black"}`}>
                Education
              </h1>
              <div className={`mx-auto mt-2 h-px w-20 ${darkMode ? "bg-white" : "bg-black"}`} />
              <p className={`mt-2 text-xs ${darkMode ? "text-white" : "text-black"}`}>
                My Academic Journey
              </p>
            </div>

            {/* TIMELINE */}
            <div className="block md:hidden">
              {educationData.map((item, idx) => (
                <TimelineItem key={item.id} item={item} idx={idx} darkMode={darkMode} total={educationData.length} />
              ))}
            </div>
            <div className="hidden md:grid" style={{gridTemplateColumns: "1fr auto 1fr"}}>
              {educationData.map((item, idx) => (
                <TimelineItem key={item.id} item={item} idx={idx} darkMode={darkMode} total={educationData.length} />
              ))}
            </div>

            {/* FOOTER */}
            <div className="mt-2 text-center">
              <p className={`text-[10px] ${darkMode ? "text-white" : "text-black"}`}>
                © {new Date().getFullYear()} Ron Louie Magsipoc
              </p>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
